<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Breaker - Fighter</title>
    <style>
        body { margin: 0; background: #05050a; overflow: hidden; font-family: monospace; color: #00ff66; text-align: center; user-select: none; }
        canvas { background: #120b1a; display: block; margin: 0 auto; border-bottom: 2px solid #00ff66; }
        #ui { padding: 10px; font-size: 18px; font-weight: bold; }
        .btn-container { margin-top: 10px; display: flex; justify-content: center; gap: 10px; }
        button { background: #00ff66; border: none; padding: 14px 24px; font-weight: bold; cursor: pointer; border-radius: 5px; color: #05050a; }
    </style>
</head>
<body>
    <div id="ui">COMBO: <span id="comboVal">0</span> | HEALTH: <span id="hpVal">❤️❤️❤️</span></div>
    <canvas id="gameCanvas" width="360" height="320"></canvas>
    <div class="btn-container">
        <button onclick="attack('left')">⬅️ LEFT STRIKE</button>
        <button onclick="attack('right')">RIGHT STRIKE ➡️</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        let gameSessionId = null;
        let gameReady = false;
        let scoreSubmitted = false;

        async function startSecureGame(game) {
            if (!tg || !tg.initData) {
                throw new Error("Open this game from the Telegram bot.");
            }
            tg.ready();
            tg.expand();
            if (tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(() => tg.close()); }
            const res = await fetch('/api/game/start', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': tg.initData
                },
                body: JSON.stringify({ game })
            });
            const data = await res.json();
            if (!res.ok || data.status !== 'success') throw new Error(data.message || 'Unable to start game');
            gameSessionId = data.session_id;
            gameReady = true;
            scoreSubmitted = false;
            return data;
        }

        async function saveSecureScore(game, score) {
            if (!gameSessionId || scoreSubmitted) return { status: 'error', message: scoreSubmitted ? 'Score already submitted' : 'No active game session' };
            const res = await fetch('/api/save-score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': tg.initData
                },
                body: JSON.stringify({ session_id: gameSessionId, game, score })
            });
            const data = await res.json();
            if (res.ok && data.status === 'success') scoreSubmitted = true;
            return data;
        }



        startSecureGame('fighting').catch(err => {
            console.error(err);
            alert(err.message || 'Please open this game from Telegram.');
        });

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let combo = 0, hp = 3, isGameOver = false;
        let enemy = { side: 'left', x: 50, timer: 100 };

        function spawnEnemy() {
            if (isGameOver || !gameReady) return;
            enemy.side = Math.random() < 0.5 ? 'left' : 'right';
            enemy.x = enemy.side === 'left' ? 60 : 300;
            enemy.timer = Math.max(35, 90 - (combo * 2));
        }

        function attack(direction) {
            if (isGameOver || !gameReady) return;
            if (direction === enemy.side) {
                combo++;
                document.getElementById("comboVal").innerText = combo;
                spawnEnemy();
            } else {
                hp--;
                updateHP();
                if (hp <= 0) gameOver();
            }
        }

        function updateHP() {
            document.getElementById("hpVal").innerText = "❤️".repeat(hp);
        }

        function update() {
            if (isGameOver || !gameReady) return;
            enemy.timer--;
            if (enemy.timer <= 0) {
                hp--;
                updateHP();
                if (hp <= 0) gameOver();
                else spawnEnemy();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.shadowBlur = 15; ctx.shadowColor = "#00ff66"; ctx.fillStyle = "#00ff66";
            ctx.fillRect(170, 240, 20, 40);

            ctx.shadowColor = "#ff0055"; ctx.fillStyle = "#ff0055";
            ctx.fillRect(enemy.x - 10, 240, 20, 40);

            ctx.fillStyle = "#ffff00";
            ctx.fillRect(40, 30, enemy.timer * 3.1, 8);
            ctx.shadowBlur = 0;
        }

        function loop() {
            update(); draw();
            if (!isGameOver) requestAnimationFrame(loop);
        }

        async function gameOver() {
            isGameOver = true;
            alert("Knockout! Final Combo: " + combo);
            const result = await saveSecureScore('fighting', combo);
            if (result.status !== 'success') console.warn('Score was not saved:', result.message);
        }

        spawnEnemy();
        loop();
    </script>
</body>
</html>
