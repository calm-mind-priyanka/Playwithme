<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Void - Shooter</title>
    <style>
        body { margin: 0; background: #030308; overflow: hidden; font-family: 'Courier New', monospace; color: #00ffff; text-align: center; user-select: none; }
        canvas { background: #070714; display: block; margin: 0 auto; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        #ui { position: absolute; top: 10px; left: 0; right: 0; padding: 0 20px; display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; pointer-events: none; text-shadow: 0 0 5px #00ffff; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,3,8,0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; gap: 12px; }
        .hidden { display: none !important; }
        h1 { color: #ff0055; text-shadow: 0 0 10px #ff0055; margin: 0; font-size: 26px; }
        p { color: #8888aa; font-size: 14px; margin: 0; }
        button { background: #ff0055; color: #fff; border: none; padding: 10px 24px; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; box-shadow: 0 0 10px #ff0055; width: 220px; }
        button.share { background: #0088cc; box-shadow: 0 0 10px #0088cc; }
    </style>
</head>
<body>
    <div id="ui">
        <div>SCORE: <span id="scoreVal">0</span></div>
        <div>LVL: <span id="levelVal">1</span></div>
    </div>

    <div id="startScreen" class="screen">
        <h1>CYBER VOID</h1>
        <p>Sector 1: Firewall Defense</p>
        <button onclick="startGame()">INITIATE MISSION</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h1>SYSTEM FAILURE</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="startGame()">RETRY MISSION</button>
        <button class="share" onclick="challengeFriend()">⚔️ CHALLENGE FRIEND</button>
    </div>

    <canvas id="gameCanvas" width="360" height="560"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let score = 0, level = 1, isPlaying = false;
        let player = { x: 180, y: 480, size: 18 };
        let bullets = [], enemies = [], particles = [], stars = [];

        for(let i=0; i<40; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 2 + 0.5 });
        }

        window.addEventListener("mousemove", (e) => {
            let rect = canvas.getBoundingClientRect();
            player.x = Math.max(20, Math.min(canvas.width - 20, e.clientX - rect.left));
        });
        window.addEventListener("touchmove", (e) => {
            let rect = canvas.getBoundingClientRect();
            player.x = Math.max(20, Math.min(canvas.width - 20, e.touches[0].clientX - rect.left));
        });
        window.addEventListener("click", () => {
            if (isPlaying) bullets.push({ x: player.x, y: player.y - 10, speed: 9 });
        });

        function startGame() {
            score = 0; level = 1;
            bullets = []; enemies = []; particles = [];
            document.getElementById("scoreVal").innerText = score;
            document.getElementById("levelVal").innerText = level;
            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            isPlaying = true;
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 20 });
            }
        }

        function update() {
            if (!isPlaying) return;

            stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) s.y = 0; });

            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(index, 1);
            });

            if (Math.random() < 0.03 + (level * 0.008)) {
                enemies.push({ x: Math.random() * 300 + 30, y: -20, size: 16, speed: 1.5 + (level * 0.4) });
            }

            enemies.forEach((en, eIndex) => {
                en.y += en.speed;

                if (Math.hypot(player.x - en.x, player.y - en.y) < player.size) gameOver();

                bullets.forEach((b, bIndex) => {
                    if (Math.hypot(b.x - en.x, b.y - en.y) < en.size + 4) {
                        createExplosion(en.x, en.y);
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 100;
                        document.getElementById("scoreVal").innerText = score;
                        if (score >= level * 600) { level++; document.getElementById("levelVal").innerText = level; }
                    }
                });

                if (en.y > canvas.height) enemies.splice(eIndex, 1);
            });

            particles.forEach((p, index) => { p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) particles.splice(index, 1); });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            stars.forEach(s => { ctx.globalAlpha = s.speed / 3; ctx.fillRect(s.x, s.y, s.size, s.size); });
            ctx.globalAlpha = 1.0;

            particles.forEach(p => { ctx.fillStyle = "#ff0055"; ctx.fillRect(p.x, p.y, 3, 3); });

            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffff";
            ctx.fillStyle = "#00ffff";
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 16);
            ctx.lineTo(player.x - 12, player.y + 14);
            ctx.lineTo(player.x, player.y + 8);
            ctx.lineTo(player.x + 12, player.y + 14);
            ctx.closePath();
            ctx.fill();

            ctx.shadowColor = "#ff0055";
            ctx.fillStyle = "#ff0055";
            bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 12));

            ctx.shadowColor = "#ffcc00";
            ctx.fillStyle = "#ffcc00";
            enemies.forEach(en => ctx.fillRect(en.x - 12, en.y - 12, 24, 24));
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById("finalScore").innerText = score;
            document.getElementById("gameOverScreen").classList.remove("hidden");

            fetch('/api/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: 12345, game: 'shooter', score: score })
            });
        }

        function challengeFriend() {
            let shareText = encodeURIComponent(`⚡ I just scored ${score} points in Cyber Void! Can you beat my score in the Cyber Arcade Hub?`);
            window.open(`https://t.me/share/url?url=https://t.me/&text=${shareText}`, '_blank');
        }

        loop();
    </script>
</body>
</html>
